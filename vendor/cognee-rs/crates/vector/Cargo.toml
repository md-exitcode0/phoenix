[package]
name = "cognee-vector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Vector-store abstraction with brute-force, LanceDB, and pgvector adapters for cognee."
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
authors.workspace = true

[lints]
workspace = true

[features]
pgvector = ["dep:sea-orm", "dep:sea-orm-migration"]
# LanceDB is opt-in: it drags in the Arrow + DataFusion native stack (protoc,
# huge build). Phoenix uses the pure-Rust BruteForceVectorDB instead, so this
# feature stays OFF. Enable it to restore the embedded LanceDB adapter.
lancedb  = ["dep:lancedb", "dep:arrow-array", "dep:arrow-schema", "dep:futures"]
testing  = []

[dependencies]
# Async
tokio       = { workspace = true }
async-trait = { workspace = true }

# PGVector / SeaORM (feature-gated)
sea-orm = { version = "1.1", features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "with-uuid",
    "with-json",
], optional = true }
sea-orm-migration = { version = "1.1", features = [
    "runtime-tokio-rustls",
], optional = true }

# Data structures
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Error handling
thiserror = { workspace = true }
tracing = { workspace = true }

# Telemetry constants
cognee-utils = { path = "../utils", version = "0.1.1" }

[dev-dependencies]
tempfile.workspace = true
serial_test.workspace = true
cognee-test-utils = { path = "../test-utils" }
cognee-models = { path = "../models" }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

# LanceDB adapter (durable embedded vector store) — now behind the opt-in
# `lancedb` feature (Arrow/DataFusion native stack). Off by default; Phoenix
# uses BruteForceVectorDB. See lancedb_adapter.rs.
[dependencies.lancedb]
version = "=0.29"
optional = true

[dependencies.arrow-array]
version = "58"
optional = true

[dependencies.arrow-schema]
version = "58"
optional = true

[dependencies.futures]
version = "0.3"
optional = true
