<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Desktop viewer acceptance</title>
<link rel="stylesheet" href="../../desktop-viewer.css"><style>
:root{--ink:#282726;--ink-soft:#797571;--ink-faint:#918c87;--surface:#fff;--bg:#f4f2ef;--line:#e7e3de;font:14px system-ui;color:var(--ink);background:var(--bg)}body{margin:28px auto;max-width:980px;padding:0 20px}header{display:flex;align-items:center;gap:12px;margin-bottom:18px}h1{font-size:18px;flex:1}button{border:1px solid var(--line);border-radius:7px;padding:8px 12px;background:var(--surface);color:var(--ink);cursor:pointer}.frame{border:1px solid var(--line);border-radius:12px;overflow:hidden;height:580px;box-shadow:0 12px 36px #2827260a}.desktop-workspace-toolbar{height:44px;display:flex;align-items:center;background:var(--surface);border-bottom:1px solid var(--line)}.inspection-desktop-panel{height:calc(100% - 45px)}output{display:block;margin:12px 0;color:var(--ink-soft);font-size:12px}.dark{--ink:#eee9e4;--ink-soft:#b4aba3;--ink-faint:#9c958f;--surface:#252321;--bg:#1e1c1a;--line:#403c37}#fixturePanel[hidden]{display:none}@media(max-width:600px){body{padding:0 10px;margin:10px auto}.frame{height:480px}header{gap:6px;flex-wrap:wrap}}
</style><header><h1>Desktop viewer <small>· test fixture</small></h1><button id="show">Show</button><button id="hide">Hide</button><button id="error">Connection error</button><button id="decode">Corrupt frame once</button><button id="recreate">Recreate desktop</button><button id="theme">Theme</button><button id="pause">Check paused requests</button></header>
<div id="fixturePanel" class="frame"><div class="desktop-workspace-toolbar"><select id="desktopWorkspacePicker" aria-label="Agent desktop"></select><span id="desktopWorkspaceStatus" class="desktop-workspace-status" role="status"></span></div><section class="inspection-desktop-panel"><div class="desktop-observation-stage"><img id="desktopObservationImage" alt="" hidden><p id="desktopObservationEmpty" class="desktop-observation-empty">Loading…</p></div><footer id="desktopObservationCaption" class="desktop-observation-caption">Latest observation</footer></section></div><output id="checks">Preparing fixture</output>
<script src="../../desktop-viewer.js"></script><script>
(async()=>{
const blob=await fetch('blender.png').then(r=>r.blob());const data=await new Promise(resolve=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.readAsDataURL(blob)});
const captured=Date.now()-15000;let calls=0,fail=false,corruptNext=false,noCapture=false;const output=document.getElementById('checks');
const rpc=async request=>{calls++;output.textContent=`Read-only fixture requests: ${calls}`;if(fail)throw Error('Connection interrupted. Trying again.');if(request==='DesktopWorkspaces')return{DesktopWorkspaces:[{scope_key:'leo',label:'Leo · Blender',running:true,in_use:true},{scope_key:'iris',label:'Iris · Design review',running:true,in_use:false}]};const q=request.DesktopObservation;await new Promise(r=>setTimeout(r,q.scope_key==='leo'?450:10));return{DesktopObservation:{scope_key:q.scope_key,captured_at_ms:noCapture?null:captured,width:1440,height:960,kind:'desktop',data_url:noCapture||q.after_ms>=captured?null:corruptNext?(corruptNext=false,'data:image/png;base64,broken'):data}};};
const update=visible=>{document.getElementById('fixturePanel').hidden=!visible;window.PhoenixDesktopViewer.update({visible,context:'fixture',rpc})};
document.getElementById('show').onclick=()=>{fail=false;update(true)};document.getElementById('hide').onclick=()=>update(false);
document.getElementById('error').onclick=()=>{fail=true;update(false);update(true)};
document.getElementById('decode').onclick=()=>{corruptNext=true;update(false);window.PhoenixDesktopViewer.update({visible:false,context:'reset',rpc});update(true)};
document.getElementById('recreate').onclick=()=>{noCapture=!noCapture;document.getElementById('recreate').textContent=noCapture?'Publish new capture':'Recreate desktop'};
document.getElementById('theme').onclick=()=>document.documentElement.classList.toggle('dark');
document.getElementById('pause').onclick=async()=>{update(false);const before=calls;await new Promise(r=>setTimeout(r,1900));output.textContent=calls===before?'PASS: hidden panel issued no requests':'FAIL: hidden panel continued requesting';};update(true);
})();
</script></html>
